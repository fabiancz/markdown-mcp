[project]
name = "obsidian-read-mcp"
version = "0.2.2"
description = "Self-hosted, snapshot-consistent Markdown vault MCP server"
requires-python = ">=3.12,<3.14"
dependencies = ["fastmcp==3.4.7", "httpx==0.28.1", "PyYAML==6.0.3", "pydantic-settings==2.13.1", "py-key-value-aio[disk]==0.4.4"]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["forgejo_live: disposable loopback Forgejo integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
