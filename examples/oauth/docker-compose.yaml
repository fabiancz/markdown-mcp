services:
  mcp:
    image: ${IMAGE:?Set a released image tag or local test image}
    user: 10001:10001
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      DEPLOYMENT_MODE: oauth
      GIT_PROVIDER: ${GIT_PROVIDER:?Set GIT_PROVIDER}
      GIT_REPO_URL: ${GIT_REPO_URL:?Set GIT_REPO_URL}
      GIT_TARGET_BRANCH: ${GIT_TARGET_BRANCH:-}
      GIT_USERNAME: ${GIT_USERNAME:?Set GIT_USERNAME}
      GIT_PAT: ${GIT_PAT:?Set GIT_PAT}
      FORGE_API_URL: ${FORGE_API_URL:-}
      FORGE_REPO_ID: ${FORGE_REPO_ID:-}
      GIT_COMMIT_NAME: ${GIT_COMMIT_NAME:-Vault MCP Bot}
      GIT_COMMIT_EMAIL: ${GIT_COMMIT_EMAIL:-vault-mcp@example.invalid}
      SYNC_BEFORE_READ: ${SYNC_BEFORE_READ:-true}
      SYNC_MIN_INTERVAL_SECONDS: ${SYNC_MIN_INTERVAL_SECONDS:-0}
      SYNC_FAILURE_POLICY: ${SYNC_FAILURE_POLICY:-serve_stale}
      GIT_TIMEOUT_SECONDS: ${GIT_TIMEOUT_SECONDS:-15}
      ALLOWED_FOLDERS: ${ALLOWED_FOLDERS:-}
      EXCLUDED_FOLDERS: ${EXCLUDED_FOLDERS:-.git,.obsidian,.trash,repo,data}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-32768}
      MAX_INDEX_BYTES: ${MAX_INDEX_BYTES:-268435456}
      SNAPSHOT_RETENTION_SECONDS: ${SNAPSHOT_RETENTION_SECONDS:-900}
      SNAPSHOT_MAX_BYTES: ${SNAPSHOT_MAX_BYTES:-1073741824}
      WRITE_ENABLED: ${WRITE_ENABLED:-false}
      WRITE_DEFAULT_MODE: ${WRITE_DEFAULT_MODE:-review}
      YOLO_ENABLED: ${YOLO_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?Set OAuth client ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Set OAuth client secret}
      GITHUB_ALLOWED_USER_IDS: ${GITHUB_ALLOWED_USER_IDS:?Set numeric user IDs}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS:?Set exact client callback URIs}
    volumes:
    - ${REPO_DIR:-./repo}:/repo
    - ${DATA_DIR:-./data}:/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    ports:
    - 127.0.0.1:${HOST_PORT:-8000}:8000
